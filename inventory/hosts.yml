---
# Declare each machine under the same name as in PXE Tools (Machines page).
# PXE Tools limits the run to that name: a missing or different name matches
# no host and the job fails.
all:
  children:
    pxe_tools:
      hosts: {}
      # Example:
      # hosts:
      #   web-01:
      #     ansible_host: 192.0.2.10
